name: Extract Lacanau bathymetry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyproj
      - name: Extract Lacanau soundings
        run: python tools/extract_lacanau.py
      - name: Show report
        run: cat data/lacanau_soundings_report.json
      - name: Commit extracted public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lacanau_soundings_raw.csv data/lacanau_soundings.geojson data/lacanau_soundings_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Add official Lacanau bathymetry soundings"
          git push
