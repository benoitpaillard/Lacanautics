name: Activate OLED black theme
on:
  push:
    branches: [main]
    paths:
      - 'tools/activate_oled_black.py'
      - '.github/workflows/activate-oled-black.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply OLED black theme
        run: python tools/activate_oled_black.py
      - name: Validate application syntax and black theme
        run: |
          grep -q -- '--land:#000000' index.html
          grep -q 'theme-color" content="#000000"' index.html
          grep -q 'sw.js?v=singlepage5-oledblack' index.html
          grep -q 'lacanautics-v4.5-singlepage5-oledblack' sw.js
          grep -q 'tiles/mobile-v1' index.html
          python - <<'PY'
          import re,pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check sw.js
      - name: Commit OLED theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Use OLED black background and dark controls"
          git push
