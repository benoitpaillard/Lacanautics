name: Activate Survey v3.1 vector lines
on:
  push:
    branches: [main]
    paths:
      - 'bathymetry-2012-v31.svg'
      - 'data/lacanau_v31_visual_report.json'
      - '.github/workflows/activate-v31-vector-lines.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch app to vector Survey v3.1
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('bathymetry-2012-v3.webp?v=31h1','bathymetry-2012-v31.svg?v=31v1')
          s=s.replace(
            'Survey v3.1: original 10 m survey grid rendered with the same 0–8 m colors, land tone and contour styling as Vector 4.5. Tap 3.1 to return to Vector 4.5.',
            'Survey v3.1: original 10 m depth classes vectorized at cell edges, using the same line widths, opacity, round joins/caps and 0–8 m colors as Vector 4.5. Tap 3.1 to return to Vector 4.5.'
          )
          s=s.replace('Survey v3.1 · 10 m grid · harmonized scale','Survey v3.1 · 10 m grid · matched vector lines')
          s=s.replace("register('./sw.js?v=singlepage1')","register('./sw.js?v=singlepage2-v31lines')")
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("lacanautics-v4.5-singlepage1","lacanautics-v4.5-singlepage2-v31lines")
          s=s.replace("'./bathymetry-2012-v3.webp'","'./bathymetry-2012-v31.svg'")
          p.write_text(s,encoding='utf-8')
          PY
          rm -f bathymetry-2012-v3.webp
      - name: Validate activation
        run: |
          test -s bathymetry-2012-v31.svg
          test ! -e bathymetry-2012-v3.webp
          grep -q 'bathymetry-2012-v31.svg?v=31v1' index.html
          grep -q 'matched vector lines' index.html
          grep -q "sw.js?v=singlepage2-v31lines" index.html
          grep -q 'lacanautics-v4.5-singlepage2-v31lines' sw.js
          grep -q 'bathymetry-2012-v31.svg' sw.js
          ! grep -q 'bathymetry-2012-v3.webp' sw.js
          node --check sw.js
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html sw.js bathymetry-2012-v3.webp
          git diff --cached --quiet && exit 0
          git commit -m "Force matched Survey v3.1 vector lines"
          git push
