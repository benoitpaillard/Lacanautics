name: Validate web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hires.html'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'bathymetry-geopdf-v4.webp'
      - 'data/lacanau_geopdf_v4.json'
      - '.github/workflows/validate-web.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check referenced v4 assets
        run: |
          test -s bathymetry-geopdf-v4.webp
          test -s data/lacanau_geopdf_v4.json
          test -s data/lacanau_lake_level.json
          python -m json.tool data/lacanau_geopdf_v4.json >/dev/null
          python -m json.tool data/lacanau_lake_level.json >/dev/null
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          html=pathlib.Path('hires.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert scripts, 'No inline script found'
          pathlib.Path('/tmp/lacanautics-app.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'bathymetry-geopdf-v4.webp' in html
          assert 'lacanau_geopdf_v4.json' in html
          PY
          node --check /tmp/lacanautics-app.js
      - name: Check service worker version
        run: grep -q "lacanautics-v4" sw.js
