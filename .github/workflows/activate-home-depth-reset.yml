name: Activate home depth reset
on:
  push:
    branches: [main]
    paths:
      - 'tools/home_resets_depth.py'
      - '.github/workflows/activate-home-depth-reset.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Home depth reset
        run: python tools/home_resets_depth.py
      - name: Validate app syntax and Home behavior
        run: |
          grep -q "fit').onclick=()=>{clearProbe();fit()}" index.html
          grep -q 'sw.js?v=singlepage7-homedepth' index.html
          grep -q 'lacanautics-v4.5-singlepage7-homedepth' sw.js
          python - <<'PY'
          import re,pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check sw.js
      - name: Commit Home behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Reset depth to GPS when pressing Home"
          git push
