name: Inspect GeoPDF native layers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/inspect_geopdf_native_layers.py'
      - '.github/workflows/inspect-geopdf-native.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf pillow numpy
      - run: python tools/inspect_geopdf_native_layers.py
      - run: cat data/geopdf_native_layers_report.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geopdf_native_layers_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Add native GeoPDF layer report"
          git pull --rebase origin main
          git push
