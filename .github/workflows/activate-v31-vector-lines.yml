name: Activate Survey v3.1 vector lines
on:
  push:
    branches: [main]
    paths:
      - 'bathymetry-2012-v31.svg'
      - 'data/lacanau_v31_visual_report.json'
      - '.github/workflows/activate-v31-vector-lines.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch app to vector Survey v3.1
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('bathymetry-2012-v3.webp?v=31h1','bathymetry-2012-v31.svg?v=31v1')
          s=s.replace(
            'Survey v3.1: original 10 m survey grid rendered with the same 0–8 m colors, land tone and contour styling as Vector 4.5. Tap 3.1 to return to Vector 4.5.',
            'Survey v3.1: original 10 m depth classes vectorized at cell edges, using the same line widths, opacity, round joins/caps and 0–8 m colors as Vector 4.5. Tap 3.1 to return to Vector 4.5.'
          )
          s=s.replace('Survey v3.1 · 10 m grid · harmonized scale','Survey v3.1 · 10 m grid · matched vector lines')
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("lacanautics-v4.5-singlepage1","lacanautics-v4.5-singlepage2-v31lines")
          s=s.replace("'./bathymetry-2012-v3.webp'","'./bathymetry-2012-v31.svg'")
          p.write_text(s,encoding='utf-8')

          p=Path('.github/workflows/validate-web.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("      - 'bathymetry-2012-v3.webp'","      - 'bathymetry-2012-v31.svg'")
          s=s.replace('test -s bathymetry-2012-v3.webp','test -s bathymetry-2012-v31.svg')
          s=s.replace("assert 'bathymetry-2012-v3.webp?v=31h1' in html","assert 'bathymetry-2012-v31.svg?v=31v1' in html")
          s=s.replace("assert v31['shoreline_opacity'] == 0.62","assert v31['shoreline_opacity'] == 0.62\n          assert v31['inner_contour_width_px'] == 0.62\n          assert v31['shoreline_width_px'] == 0.72\n          assert v31['line_join'] == 'round'\n          assert v31['line_cap'] == 'round'")
          s=s.replace("grep -q \"lacanautics-v4.5-singlepage1\" sw.js","grep -q \"lacanautics-v4.5-singlepage2-v31lines\" sw.js")
          s=s.replace("grep -q 'bathymetry-2012-v3.webp' sw.js","grep -q 'bathymetry-2012-v31.svg' sw.js")
          s=s.replace("! grep -q 'bathymetry-geopdf-v41-native.webp' sw.js","grep -q 'stroke-width=\"0.62\"' bathymetry-2012-v31.svg\n          grep -q 'stroke-width=\"0.72\"' bathymetry-2012-v31.svg\n          ! grep -q 'bathymetry-geopdf-v41-native.webp' sw.js")
          p.write_text(s,encoding='utf-8')
          PY
          rm -f bathymetry-2012-v3.webp
      - name: Validate activation
        run: |
          test -s bathymetry-2012-v31.svg
          test ! -e bathymetry-2012-v3.webp
          grep -q 'bathymetry-2012-v31.svg?v=31v1' index.html
          grep -q 'matched vector lines' index.html
          grep -q 'lacanautics-v4.5-singlepage2-v31lines' sw.js
          grep -q 'bathymetry-2012-v31.svg' sw.js
          ! grep -q 'bathymetry-2012-v3.webp' sw.js
          node --check sw.js
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html sw.js .github/workflows/validate-web.yml bathymetry-2012-v3.webp
          git diff --cached --quiet && exit 0
          git commit -m "Use matched vector lines for Survey v3.1"
          git push
