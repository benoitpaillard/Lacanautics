name: Build Survey v3.1 vector lines
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_v31_harmonized.py'
      - '.github/workflows/build-v31-vector-lines.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy scikit-image
      - name: Build Survey v3.1 SVG
        run: python tools/build_v31_harmonized.py
      - name: Validate matching line style
        run: |
          test -s bathymetry-2012-v31.svg
          grep -q 'stroke-width="0.62"' bathymetry-2012-v31.svg
          grep -q 'stroke-width="0.72"' bathymetry-2012-v31.svg
          grep -q 'stroke-linejoin="round"' bathymetry-2012-v31.svg
          grep -q 'stroke-linecap="round"' bathymetry-2012-v31.svg
          grep -q 'stroke-opacity="0.48"' bathymetry-2012-v31.svg
          grep -q 'stroke-opacity="0.62"' bathymetry-2012-v31.svg
          python -m json.tool data/lacanau_v31_visual_report.json >/dev/null
      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bathymetry-2012-v31.svg data/lacanau_v31_visual_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Harmonize Survey v3.1 contour lines with Vector 4.5"
          git push
