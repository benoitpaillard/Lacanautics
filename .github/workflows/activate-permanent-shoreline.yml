name: Activate permanent-water shoreline
on:
  push:
    branches: [main]
    paths:
      - 'tools/activate_permanent_shoreline.py'
      - '.github/workflows/activate-permanent-shoreline.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS and rendering dependencies
        run: pip install numpy scipy scikit-image pillow cairosvg requests shapely pyproj
      - name: Build authoritative open-water shoreline
        run: python tools/build_open_water_mask.py
      - name: Activate shared shoreline mask
        run: |
          python tools/activate_permanent_shoreline.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_v31_harmonized.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("bbox = {k: float(src[k]) for k in ('west','south','east','north')}", "bbox = {k: float(src['bbox'][k]) for k in ('west','south','east','north')}")
          p.write_text(s,encoding='utf-8')
          assert "src['bbox'][k]" in s
          PY
      - name: Rebuild Vector 4.5 and Survey v3.1
        run: |
          python tools/build_vector_v45_taubin.py
          python tools/build_v31_harmonized.py
      - name: Rebuild mobile maps and sharp PNG tiles
        run: |
          python tools/build_mobile_rasters.py
          python tools/build_mobile_tiles.py
      - name: Validate shoreline correction
        run: |
          python - <<'PY'
          import json,re,pathlib
          m=json.loads(pathlib.Path('data/lacanau_open_water_mask_report.json').read_text())
          v45=json.loads(pathlib.Path('data/lacanau_vector_v45_taubin_report.json').read_text())
          v31=json.loads(pathlib.Path('data/lacanau_v31_visual_report.json').read_text())
          assert 10 < m['main_open_water_area_km2'] < 25
          assert m['intermittent_lacanau_fringe_area_in_query_m2'] > 0
          assert m['marsh_area_in_query_m2'] > 0
          for r in (v45,v31):
              s=r['shoreline_mask']
              assert s['water_cells_removed'] > 0
              assert 0 < s['removed_fraction_of_original_water'] < 0.20
              assert s['adds_water'] is False
          assert v45['depth_label_count']==0
          assert v45['qc']['all_overlap_within_1m_fraction']>0.999
          html=pathlib.Path('index.html').read_text()
          assert 'function isOpenWater(lat,lon)' in html
          assert "shorelineURL='data/lacanau_open_water_mask.geojson?v=1'" in html
          assert '.png?v=2`' in html
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(x for x in scripts if x.strip()))
          print('Vector removed',v45['shoreline_mask'])
          print('Survey removed',v31['shoreline_mask'])
          print('Open-water source',m)
          PY
          node --check /tmp/app.js
          node --check sw.js
      - name: Commit corrected maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js \
            tools/build_vector_v45_taubin.py tools/build_v31_harmonized.py \
            data/lacanau_open_water_mask.geojson data/lacanau_open_water_mask_report.json \
            bathymetry-geopdf-v45-taubin.svg data/lacanau_vector_v45_taubin_report.json \
            bathymetry-2012-v31.svg data/lacanau_v31_visual_report.json \
            bathymetry-geopdf-v45-mobile.webp bathymetry-2012-v31-mobile.webp tiles/mobile-v1
          git diff --cached --quiet && exit 0
          git commit -m "Clip both bathymetry maps to permanent Lacanau water"
          git push
