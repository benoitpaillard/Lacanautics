name: Activate fast mobile map rendering
on:
  push:
    branches: [main]
    paths:
      - 'bathymetry-geopdf-v45-mobile.webp'
      - 'bathymetry-2012-v31-mobile.webp'
      - '.github/workflows/activate-mobile-fastpath.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile fast path
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
            '<img id="map" src="bathymetry-geopdf-v45-taubin.svg?v=45"',
            '<img id="map" src="bathymetry-geopdf-v45-mobile.webp?v=m1" decoding="async"'
          )
          s=s.replace(
            '#world{position:absolute;transform-origin:0 0;will-change:transform}',
            '#world{position:absolute;transform-origin:0 0;will-change:transform;backface-visibility:hidden;contain:layout paint style}'
          )
          marker="const REF=13.21,surveyURL='data/lacanau_2012_bands_v3.json?v=411',v41URL='data/lacanau_geopdf_v41.json?v=411',levelURL='data/lacanau_lake_level.json?v=411';"
          if 'const FAST_RASTER=' not in s:
              s=s.replace(marker, marker+"\nconst FAST_RASTER=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0||innerWidth<900;")
          s=s.replace(
            "map.src='bathymetry-geopdf-v45-taubin.svg?v=45'",
            "map.src=FAST_RASTER?'bathymetry-geopdf-v45-mobile.webp?v=m1':'bathymetry-geopdf-v45-taubin.svg?v=45'"
          )
          s=s.replace(
            "map.src='bathymetry-2012-v31.svg?v=31v1'",
            "map.src=FAST_RASTER?'bathymetry-2012-v31-mobile.webp?v=m1':'bathymetry-2012-v31.svg?v=31v1'"
          )
          s=s.replace(
            "meta.textContent='Sub-pixel SVG zones · source ~5.66 m/px'",
            "meta.textContent=FAST_RASTER?'Fast mobile raster · source ~5.66 m/px':'Sub-pixel SVG zones · source ~5.66 m/px'"
          )
          s=s.replace(
            "meta.textContent='Survey v3.1 · 10 m grid · matched vector lines'",
            "meta.textContent=FAST_RASTER?'Survey v3.1 · fast mobile raster':'Survey v3.1 · 10 m grid · matched vector lines'"
          )
          old="function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}"
          new="let transformRAF=0;function apply(){if(transformRAF)return;transformRAF=requestAnimationFrame(()=>{transformRAF=0;world.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`})}"
          s=s.replace(old,new)
          s=s.replace("register('./sw.js?v=singlepage2-v31lines')","register('./sw.js?v=singlepage3-mobilefast')")
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("lacanautics-v4.5-singlepage2-v31lines","lacanautics-v4.5-singlepage3-mobilefast")
          s=s.replace(
            "'./bathymetry-geopdf-v45-taubin.svg','./bathymetry-geopdf-v41-classes.webp'",
            "'./bathymetry-geopdf-v45-taubin.svg','./bathymetry-geopdf-v45-mobile.webp','./bathymetry-geopdf-v41-classes.webp'"
          )
          s=s.replace(
            "'./bathymetry-2012-v31.svg','./data/lacanau_2012_bands_v3.json'",
            "'./bathymetry-2012-v31.svg','./bathymetry-2012-v31-mobile.webp','./data/lacanau_2012_bands_v3.json'"
          )
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate fast path
        run: |
          grep -q '<img id="map" src="bathymetry-geopdf-v45-mobile.webp?v=m1" decoding="async"' index.html
          grep -q "const FAST_RASTER=" index.html
          grep -q 'bathymetry-geopdf-v45-mobile.webp?v=m1' index.html
          grep -q 'bathymetry-2012-v31-mobile.webp?v=m1' index.html
          grep -q 'requestAnimationFrame' index.html
          grep -q 'translate3d' index.html
          grep -q 'sw.js?v=singlepage3-mobilefast' index.html
          grep -q 'lacanautics-v4.5-singlepage3-mobilefast' sw.js
          grep -q 'bathymetry-geopdf-v45-mobile.webp' sw.js
          grep -q 'bathymetry-2012-v31-mobile.webp' sw.js
          node --check sw.js
          python - <<'PY'
          import re, pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(s for s in scripts if s.strip()),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit fast path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Avoid initial SVG render on phones"
          git push
