name: Activate adaptive mobile PNG tiles
on:
  push:
    branches: [main]
    paths:
      - 'tiles/mobile-v1/manifest.json'
      - 'tools/activate_mobile_tiles.py'
      - '.github/workflows/activate-mobile-tiles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch adaptive tile renderer
        run: python tools/activate_mobile_tiles.py
      - name: Validate tile renderer
        run: |
          test -s tiles/mobile-v1/manifest.json
          grep -q '#tiles{' index.html
          grep -q '<div id="tiles"></div>' index.html
          grep -q "const TILE_ROOT='tiles/mobile-v1'" index.html
          grep -q 'function updateTiles()' index.html
          grep -q 'TILE_LEVELS=\[2,4,8\]' index.html
          grep -q 'Adaptive PNG tiles' index.html
          grep -q 'sw.js?v=singlepage4-mobiletiles' index.html
          grep -q 'lacanautics-v4.5-singlepage4-mobiletiles' sw.js
          python - <<'PY'
          import re,pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check sw.js
      - name: Commit renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Use adaptive sharp PNG tiles on phones"
          git push
