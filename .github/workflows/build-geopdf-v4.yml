name: Build GeoPDF bathymetry v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-geopdf-v4.yml'
      - 'tools/build_geopdf_v4.py'
      - 'data/lacanau_islands.geojson'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pymupdf numpy scipy pillow shapely
      - name: Build from official GeoPDF
        run: python tools/build_geopdf_v4.py
      - name: Show QC report
        run: cat data/lacanau_geopdf_v4_report.json
      - name: Commit GeoPDF-derived products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bathymetry-geopdf-v4.webp data/lacanau_geopdf_v4.json data/lacanau_geopdf_v4_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish official GeoPDF bathymetry v4"
          git push
