name: Diagnose v4.1 vs v3.1
on:
  push:
    paths:
      - 'tools/diagnose_v41_vs_v31.py'
      - '.github/workflows/diagnose-v41-v31.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf pillow numpy scipy
      - run: python tools/diagnose_v41_vs_v31.py
      - run: cat data/v41_vs_v31_diagnostic.json
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v41_vs_v31_diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m "Add v4.1 vs v3.1 strip diagnostic"
          git pull --rebase
          git push
