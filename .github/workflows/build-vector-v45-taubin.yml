name: Build Taubin vector bathymetry candidate
on:
  workflow_dispatch:
  push:
    branches: [agent/taubin-smoothing]
    paths:
      - 'tools/build_vector_v45_taubin.py'
      - '.github/workflows/build-vector-v45-taubin.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy scipy scikit-image cairosvg
      - run: python tools/build_vector_v45_taubin.py
      - name: Render preview
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='bathymetry-geopdf-v45-taubin.svg', write_to='bathymetry-geopdf-v45-taubin-preview.png', output_width=971, output_height=1427)
          PY
      - name: Show Taubin QC
        run: cat data/lacanau_vector_v45_taubin_report.json
      - name: Validate candidate
        run: |
          test -s bathymetry-geopdf-v45-taubin.svg
          test -s bathymetry-geopdf-v45-taubin-preview.png
          grep -q '4.5-taubin-candidate' data/lacanau_vector_v45_taubin_report.json
          grep -q 'isobath-1m' bathymetry-geopdf-v45-taubin.svg
          grep -q '>1 m</text>' bathymetry-geopdf-v45-taubin.svg
          python - <<'PY'
          import json
          r=json.load(open('data/lacanau_vector_v45_taubin_report.json'))
          assert r['nested_violations'] == [0]*7
          assert r['size_ratio_vs_v44'] < 1.35
          assert r['qc']['all_overlap_within_1m_fraction'] > 0.999
          broad=[x for x in r['layers'][:5] if x['rings_taubin_smoothed']]
          assert broad
          assert sum(x['roughness_ratio'] for x in broad)/len(broad) < 0.90
          PY
      - name: Commit candidate assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bathymetry-geopdf-v45-taubin.svg bathymetry-geopdf-v45-taubin-preview.png data/lacanau_vector_v45_taubin_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Build Taubin-smoothed bathymetry candidate"
          git pull --rebase origin agent/taubin-smoothing
          git push
