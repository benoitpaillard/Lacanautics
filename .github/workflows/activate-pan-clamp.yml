name: Activate map pan clamp
on:
  push:
    branches: [main]
    paths:
      - 'tools/clamp_map_pan.py'
      - '.github/workflows/activate-pan-clamp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clamp map panning
        run: python tools/clamp_map_pan.py
      - name: Validate app syntax and pan clamp
        run: |
          grep -q 'function clampView()' index.html
          grep -q 'Math.max(vw-mw,tx)' index.html
          grep -q 'Math.max(vh-mh,ty)' index.html
          grep -q 'clampView();world.style.transform=' index.html
          grep -q 'sw.js?v=singlepage8-panclamp' index.html
          grep -q 'lacanautics-v4.5-singlepage8-panclamp' sw.js
          python - <<'PY'
          import re,pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check sw.js
      - name: Commit pan clamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Clamp panning to map bounds"
          git push
