name: Validate web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'gps-max.js'
      - 'manifest.webmanifest'
      - 'bathymetry-geopdf-v45-taubin.svg'
      - 'bathymetry-geopdf-v45-mobile.webp'
      - 'data/lacanau_vector_v45_taubin_report.json'
      - 'bathymetry-2012-v31.svg'
      - 'bathymetry-2012-v31-mobile.webp'
      - 'data/lacanau_v31_visual_report.json'
      - 'bathymetry-geopdf-v41-classes.webp'
      - 'data/lacanau_geopdf_v41.json'
      - 'data/lacanau_open_water_mask.geojson'
      - 'data/lacanau_open_water_mask_report.json'
      - 'tiles/mobile-v1/**'
      - 'tools/shoreline_mask.py'
      - '.github/workflows/validate-web.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app and data assets
        run: |
          test -s index.html
          test -s sw.js
          test -s gps-max.js
          test ! -e hires.html
          test -s bathymetry-geopdf-v45-taubin.svg
          test -s bathymetry-geopdf-v45-mobile.webp
          test -s bathymetry-2012-v31.svg
          test -s bathymetry-2012-v31-mobile.webp
          test -s bathymetry-geopdf-v41-classes.webp
          test -s data/lacanau_vector_v45_taubin_report.json
          test -s data/lacanau_v31_visual_report.json
          test -s data/lacanau_geopdf_v41.json
          test -s data/lacanau_lake_level.json
          test -s data/lacanau_open_water_mask.geojson
          test -s data/lacanau_open_water_mask_report.json
          test -s tiles/mobile-v1/manifest.json
          test ! -e bathymetry-geopdf-v41-native.webp
          test ! -e bathymetry-2012-v3.webp
          python -m json.tool data/lacanau_vector_v45_taubin_report.json >/dev/null
          python -m json.tool data/lacanau_v31_visual_report.json >/dev/null
          python -m json.tool data/lacanau_geopdf_v41.json >/dev/null
          python -m json.tool data/lacanau_lake_level.json >/dev/null
          python -m json.tool data/lacanau_open_water_mask.geojson >/dev/null
          python -m json.tool data/lacanau_open_water_mask_report.json >/dev/null
          python -m json.tool tiles/mobile-v1/manifest.json >/dev/null

      - name: Validate application, shoreline and bathymetry QC
        run: |
          python - <<'PY'
          import json,re,pathlib
          P=pathlib.Path
          html=P('index.html').read_text(encoding='utf-8')
          sw=P('sw.js').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          inline='\n'.join(s for s in scripts if s.strip())
          assert inline
          P('/tmp/lacanautics-app.js').write_text(inline,encoding='utf-8')

          # Current app shell / mobile renderer.
          assert 'src="./gps-max.js?v=2"' in html
          assert "register('./sw.js?v=singlepage10-sourcenames')" in html
          assert '<meta name="theme-color" content="#000000">' in html
          assert '<title>Lacanautics · Lacanau Bathymetry</title>' in html
          assert '--land:#000000' in html
          assert 'bathymetry-geopdf-v45-taubin.svg?v=45s1' in html
          assert 'bathymetry-geopdf-v45-mobile.webp?v=m2' in html
          assert 'bathymetry-2012-v31.svg?v=31v2' in html
          assert 'bathymetry-2012-v31-mobile.webp?v=m2' in html
          assert "const TILE_ROOT='tiles/mobile-v1'" in html
          assert 'TILE_LEVELS=[2,4,8]' in html
          assert '.png?v=2`' in html
          assert '<div id="tiles"></div>' in html
          assert 'function updateTiles(){' in html
          assert 'requestAnimationFrame' in html and 'translate3d' in html

          # Navigation UX retained, now source-named.
          assert 'id="probe"' in html
          assert 'function showProbe(lat,lon)' in html
          assert 'function probeAtScreen(sx,sy)' in html
          assert 'function clearProbe()' in html
          assert "$('#fit').onclick=()=>{clearProbe();fit()}" in html
          assert 'function clampView(){' in html
          assert 'Math.max(vw-mw,tx)' in html and 'Math.max(vh-mh,ty)' in html
          assert 'Adour-Garonne GeoPDF' in html
          assert 'Aquabio 2012 survey' in html
          assert 'id="sourceOverlay"' in html
          assert 'const SOURCE_INFO=' in html
          assert 'function updateSourceInfo()' in html
          assert 'FRFL49_Bathym.pdf' in html
          assert 'bathymetrie-plans-deau-gironde-2022' in html
          assert 'IGN shoreline documentation' in html

          # Same authoritative open-water gate controls both lookup engines.
          assert "shorelineURL='data/lacanau_open_water_mask.geojson?v=1'" in html
          assert 'function pointInRing(' in html
          assert 'function isOpenWater(lat,lon)' in html
          assert 'function v41Sample(lat,lon){if(!v41||!classCtx||!isOpenWater(lat,lon))return null;' in html
          assert 'function surveySample(lat,lon){if(!survey||!isOpenWater(lat,lon)||' in html
          assert 'intermittent lake fringes and marshes are land' in html

          v45=json.loads(P('data/lacanau_vector_v45_taubin_report.json').read_text())
          v31=json.loads(P('data/lacanau_v31_visual_report.json').read_text())
          v41=json.loads(P('data/lacanau_geopdf_v41.json').read_text())
          shore=json.loads(P('data/lacanau_open_water_mask_report.json').read_text())
          mask=json.loads(P('data/lacanau_open_water_mask.geojson').read_text())

          assert mask['type']=='Feature'
          assert mask['geometry']['type'] in ('Polygon','MultiPolygon')
          assert shore['authority']=='IGN BD TOPO V3 surface_hydrographique'
          assert 10 < shore['main_open_water_area_km2'] < 25
          assert shore['intermittent_lacanau_fringe_area_in_query_m2'] > 0
          assert shore['marsh_area_in_query_m2'] > 0
          assert abs(shore['simplified_area_change_fraction']) < 0.001

          for report in (v45,v31):
              m=report['shoreline_mask']
              assert m['authority']=='IGN BD TOPO V3 permanent non-marsh hydrography'
              assert m['mask_asset']=='data/lacanau_open_water_mask.geojson'
              assert m['water_cells_removed'] > 0
              assert 0 < m['removed_fraction_of_original_water'] < 0.20
              assert m['adds_water'] is False

          canonical=['#%02x%02x%02x' % tuple(c) for c in v41['palette_rgb']]
          assert v31['palette_hex']==canonical
          assert v31['contour_hex']=='#244e5a'
          assert v31['inner_contour_opacity']==0.48
          assert v31['shoreline_opacity']==0.62
          assert v31['inner_contour_width_px']==0.62
          assert v31['shoreline_width_px']==0.72
          assert v31['line_join']=='round' and v31['line_cap']=='round'
          assert v31['vector_effect']=='non-scaling-stroke'

          assert v45['nested_violations']==[0]*7
          assert v45['size_ratio_vs_v44'] < 0.5
          assert v45['qc']['all_overlap_within_1m_fraction'] > 0.999
          assert abs(v45['qc']['mean_depth_shift_m']) < 0.01
          assert v45['depth_label_count']==0

          tiles=json.loads(P('tiles/mobile-v1/manifest.json').read_text())
          assert tiles['tile_px']==1024
          assert tiles['levels']==[2,4,8]
          for mode in ('vector','v31'):
              for level in ('2','4','8'):
                  info=tiles['maps'][mode]['levels'][level]
                  files=list((P('tiles/mobile-v1')/mode/level).glob('*.png'))
                  assert len(files)==info['cols']*info['rows']
                  assert all(f.stat().st_size>0 for f in files)

          assert "lacanautics-v4.5-singlepage10-sourcenames" in sw
          assert "'./data/lacanau_open_water_mask.geojson'" in sw
          assert 'geojson|svg|webp|js' in sw
          assert 'location.replace(' not in html
          assert 'hires.html' not in html
          PY
          node --check /tmp/lacanautics-app.js
          node --check gps-max.js
          node --check sw.js
          grep -q 'enableHighAccuracy:true' gps-max.js
          grep -q 'maximumAge:0' gps-max.js

      - name: Validate map line rendering
        run: |
          grep -q 'geom-1' bathymetry-geopdf-v45-taubin.svg
          grep -q 'clip-0' bathymetry-geopdf-v45-taubin.svg
          ! grep -q '<text ' bathymetry-geopdf-v45-taubin.svg
          ! grep -q 'id="depth-labels"' bathymetry-geopdf-v45-taubin.svg
          grep -q 'stroke-width="0.62"' bathymetry-2012-v31.svg
          grep -q 'stroke-width="0.72"' bathymetry-2012-v31.svg
          grep -q 'stroke-opacity="0.48"' bathymetry-2012-v31.svg
          grep -q 'stroke-opacity="0.62"' bathymetry-2012-v31.svg
          grep -q 'stroke-linejoin="round"' bathymetry-2012-v31.svg
          grep -q 'stroke-linecap="round"' bathymetry-2012-v31.svg
