name: Inspect AEAG 2012 lake archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-aeag-2012.yml'
      - 'tools/inspect_aeag_2012_archive.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/inspect_aeag_2012_archive.py
      - run: cat data/aeag_2012_archive_report.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aeag_2012_archive_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Add AEAG 2012 archive inspection report"
          git push
