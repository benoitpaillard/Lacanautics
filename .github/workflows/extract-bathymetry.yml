name: Extract Lacanau bathymetry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-bathymetry.yml'
      - 'tools/extract_lacanau.py'
      - 'tools/build_hires_bathymetry.py'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy scipy matplotlib
      - name: Extract Lacanau soundings
        run: python tools/extract_lacanau.py
      - name: Build high-resolution bathymetry
        run: python tools/build_hires_bathymetry.py
      - name: Show QC reports
        run: |
          cat data/lacanau_soundings_report.json
          cat data/lacanau_hires_report.json
      - name: Commit extracted and derived public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lacanau_soundings_raw.csv data/lacanau_soundings.geojson data/lacanau_soundings_report.json data/lacanau_depth_grid.json data/lacanau_hires_report.json bathymetry-hires.svg
          git diff --cached --quiet && exit 0
          git commit -m "Add high-resolution Lacanau bathymetry"
          git push
