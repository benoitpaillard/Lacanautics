name: Build harmonized Survey v3.1 visual
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_v31_harmonized.py'
      - 'tools/shoreline_mask.py'
      - 'data/lacanau_open_water_mask.geojson'
      - 'data/lacanau_2012_bands_v3.json'
      - 'data/lacanau_geopdf_v41.json'
      - '.github/workflows/build-v31-harmonized.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vector dependencies
        run: pip install numpy scikit-image
      - name: Render shoreline-corrected Survey v3.1
        run: python tools/build_v31_harmonized.py
      - name: Validate Survey output
        run: |
          test -s bathymetry-2012-v31.svg
          test -s data/lacanau_v31_visual_report.json
          python - <<'PY'
          import json
          r=json.load(open('data/lacanau_v31_visual_report.json'))
          assert r['palette_hex']==['#d9f6f2','#c6efee','#afe5ec','#96d9eb','#61b9e6','#327fcd','#3158b4','#251c58']
          assert r['contour_hex']=='#244e5a'
          assert r['source_grid_size']==[491,821]
          m=r['shoreline_mask']
          assert m['authority']=='IGN BD TOPO V3 permanent non-marsh hydrography'
          assert m['water_cells_removed']>0
          assert 0<m['removed_fraction_of_original_water']<0.20
          assert m['adds_water'] is False
          PY
      - name: Commit Survey visual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bathymetry-2012-v31.svg data/lacanau_v31_visual_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild shoreline-corrected Survey v3.1"
          git push
