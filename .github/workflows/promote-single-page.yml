name: Promote Lacanautics single page
on:
  push:
    branches: [main]
    paths:
      - 'tools/promote_hires_to_index.py'
      - '.github/workflows/promote-single-page.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote full app to index.html
        run: python tools/promote_hires_to_index.py
      - name: Validate single-page structure
        run: |
          test -s index.html
          test ! -e hires.html
          grep -q 'src="./gps-max.js?v=2"' index.html
          grep -q "register('./sw.js?v=singlepage1')" index.html
          ! grep -q 'location.replace' index.html
          grep -q "lacanautics-v4.5-singlepage1" sw.js
          ! grep -q 'hires.html' sw.js
          ! grep -q 'injectGpsLayer' sw.js
          python - <<'PY'
          import re, pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          inline='\n'.join(s for s in scripts if s.strip())
          pathlib.Path('/tmp/lacanautics-inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/lacanautics-inline.js
          node --check gps-max.js
          node --check sw.js
      - name: Commit promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html hires.html sw.js manifest.webmanifest
          git diff --cached --quiet && exit 0
          git commit -m "Promote Lacanautics to single index app"
          git push
