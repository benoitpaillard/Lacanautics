name: Probe legacy AEAG Lacanau assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-legacy-aeag.yml'
      - 'tools/probe_legacy_aeag_lacanau.py'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/probe_legacy_aeag_lacanau.py
      - run: cat data/legacy_aeag_lacanau_probe.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legacy_aeag_lacanau_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Add legacy AEAG Lacanau asset probe"
          git push
