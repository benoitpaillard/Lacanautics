name: Build smooth vector bathymetry v4.4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_vector_v44.py'
      - '.github/workflows/build-vector-v44.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy scipy scikit-image
      - run: python tools/build_vector_v44.py
      - name: Show vector QC
        run: cat data/lacanau_vector_v44_report.json
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('hires.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/lacanautics-inline.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/lacanautics-inline.js
      - name: Validate v4.4 assets
        run: |
          test -s bathymetry-geopdf-v44-smooth.svg
          grep -q '4.4-smooth-isobaths' data/lacanau_vector_v44_report.json
          grep -q 'lacanautics-v4.4-smooth-isobaths' sw.js
          grep -q 'bathymetry-geopdf-v44-smooth.svg' hires.html
          grep -q '1 m contours' hires.html
          grep -q 'isobath-1m' bathymetry-geopdf-v44-smooth.svg
          grep -q '>1 m</text>' bathymetry-geopdf-v44-smooth.svg
      - name: Commit smooth vector app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bathymetry-geopdf-v44-smooth.svg data/lacanau_vector_v44_report.json hires.html index.html sw.js manifest.webmanifest
          git diff --cached --quiet && exit 0
          git commit -m "Add smooth v4.4 bathymetry and depth lines"
          git pull --rebase origin main
          git push
