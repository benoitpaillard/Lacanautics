name: Build hybrid 2012 bathymetry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hybrid-2012.yml'
      - 'tools/build_hybrid_2012.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: pip install numpy scipy pillow shapely
      - name: Build and calibrate 2012 layer
        run: python tools/build_hybrid_2012.py
      - name: Show validation report
        run: cat data/lacanau_2012_hybrid_report.json
      - name: Commit validated hybrid products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bathymetry-2012-v3.webp data/lacanau_2012_bands_v3.json data/lacanau_2012_hybrid_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Add calibrated 2012 survey bathymetry v3"
          git push
