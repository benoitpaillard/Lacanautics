name: Discover 2012 bathymetry source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-2012.yml'
      - 'tools/discover_2012_source.py'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Probe 2012 sources
        run: python tools/discover_2012_source.py
      - name: Show report
        run: cat data/lacanau_2012_source_report.json
      - name: Commit best public image and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lacanau_2012_best.png data/lacanau_2012_source_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Add best available 2012 bathymetry source"
          git push
