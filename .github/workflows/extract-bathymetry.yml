name: Extract Lacanau bathymetry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-bathymetry.yml'
      - 'tools/extract_lacanau.py'
      - 'tools/build_hires_bathymetry.py'
      - 'tools/fetch_lacanau_islands.py'
      - 'tools/apply_islands.py'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy scipy matplotlib shapely
      - name: Extract Lacanau soundings
        run: python tools/extract_lacanau.py
      - name: Build bathymetry v2.1
        run: python tools/build_hires_bathymetry.py
      - name: Fetch mapped islands
        run: python tools/fetch_lacanau_islands.py
      - name: Apply island mask
        run: python tools/apply_islands.py
      - name: Show QC reports
        run: |
          cat data/lacanau_soundings_report.json
          cat data/lacanau_hires_v2_report.json
          cat data/lacanau_island_mask_report.json
      - name: Commit extracted and derived public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lacanau_soundings_raw.csv data/lacanau_soundings.geojson data/lacanau_soundings_report.json data/lacanau_depth_grid_v2.json data/lacanau_hires_v2_report.json data/lacanau_islands.geojson data/lacanau_island_mask_report.json bathymetry-v2.svg
          git diff --cached --quiet && exit 0
          git commit -m "Publish island-masked bathymetry v2.1"
          git push
